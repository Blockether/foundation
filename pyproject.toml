[project]
name = "blockether-foundation"
version = "0.1.0"
description = ""
readme = "README.md"
requires-python = ">=3.13"
authors = [{ name = "Blockether", email = "contact@blockether.com" }]
license = { text = "MIT" }
classifiers = []

dependencies = [
    "fastapi>=0.126.0",
    "pydantic>=2.12.5",
    "tenacity>=9.1.2",
    "tantivy>=0.25.1",
    "agno>=2.3.21",
    "sqlalchemy>=2.0.45",
    "numpy>=2.2.6",
]

[project.optional-dependencies]
litellm = ["litellm>=1.80.11"]
openai = ["openai>=2.14.0"]
tts_local = ["piper-tts>=1.3.0"]
asr_local = ["faster-whisper>=1.2.1", "av>=15.1.0"]
tts_elevenlabs = ["elevenlabs>=2.27.0"]
examples = ["arxiv>=2.3.1", "wikipedia>=1.4.0", "pypdf>=6.5.0", "crawl4ai>=0.7.8", "tavily-python>=0.7.17"]
dev = [
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
    "pytest-asyncio>=1.3.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.14.10",
    "pyright>=1.1.407",
    "poethepoet>=0.38.0",
    "prettytable>=3.17.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/blockether_foundation"]
include = []

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "-m",
    "not integration",
    "--cov=blockether_foundation",
    "--cov-report=term-missing",
    "--cov-report=html",
]
asyncio_mode = "auto"
markers = [
    "unit: marks fast unit tests with mocked dependencies (default)",
    "integration: marks tests that make real LLM API calls (slow, skipped by default)",
    "agno_eval: marks tests that use Agno evaluation frameworks (agent-as-judge or accuracy)",
    "performance_test: marks tests that measure performance and benchmarks",
    "slow: marks slow running tests",
    "asyncio: marks coroutine tests that need an event loop",
]

[tool.coverage.run]
source = ["src/blockether_foundation"]
omit = ["*/tests/*", "*/__pycache__/*", "tests/integration/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501", # line too long
    "B008", # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"] # Allow unused imports in __init__.py

[tool.pyright]
include = ["src", "tests", "scripts"]
exclude = ["**/node_modules", "**/__pycache__", "**/.git", "**/.venv", "**/build", "**/dist"]
reportMissingImports = "warning"
reportMissingTypeStubs = false
pythonVersion = "3.13"
pythonPlatform = "Darwin"

# Strict diagnostic settings for maximum type safety
reportGeneralTypeIssues = "error"
reportOptionalMemberAccess = "error"
reportOptionalSubscript = "error"
reportOptionalCall = "error"
reportOptionalIterable = "error"
reportOptionalOperand = "error"
reportUntypedFunctionDecorator = "error"
reportUntypedNamedTuple = "error"
reportPrivateUsage = "warning"
reportUninitializedInstanceVariable = "error"
reportMissingParameterType = "error"
reportMissingTypeArgument = "error"
reportCallInDefaultInitializer = "error"
reportImplicitOverride = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportInconsistentConstructor = "error"
reportOverlappingOverload = "error"
reportUnnecessaryTypeIgnoreComment = "error"
reportUnknownArgumentType = "error"
reportUnknownLambdaType = "error"
reportUnknownMemberType = "none"              # TTS library has incomplete type stubs
reportUnknownParameterType = "error"
reportUnknownVariableType = "error"

# Execution environments for different parts of the project
executionEnvironments = [
    { root = "src", pythonVersion = "3.13", extraPaths = [
    ] },
    { root = "tests", pythonVersion = "3.13", extraPaths = [
        "src",
    ] },
    { root = "scripts", pythonVersion = "3.13", extraPaths = [
        "scripts/impl",
    ] },
]

[tool.poe.tasks]
test = "pytest tests/"
test-unit = "pytest tests/unit/ -m unit --no-cov"
test-integration = "pytest tests/integration/ -m 'integration or agno_eval' --no-cov"
test-unit-cov = "pytest tests/unit/ -m unit"
test-integration-cov = "pytest tests/integration/ -m integration"
test-all = "pytest tests/ -m 'unit or integration'"
test-cov = "pytest --cov=blockether_foundation --cov-report=html --cov-report=term tests/"
test-watch = "pytest-watch tests/"
lint = "ruff check src/ tests/"
lint-fix = "ruff check --fix src/ tests/"
format = "ruff format src/ tests/"
format-check = "ruff format --check src/ tests/"
type-check = "pyright src/ scripts/ tests/"
check = "bash scripts/enforce_quality.sh"
check-all = ["format-check", "lint", "type-check", "test"]
check-integration = ["format-check", "lint", "type-check", "test-integration"]

# Development environment variables
[tool.dotenv]
files = [".env", ".env.local"]

# Add scripts/impl to PYTHONPATH for development
[[tool.dotenv.overrides]]
env = "development"
PYTHONPATH = "scripts/impl:${PYTHONPATH}"
